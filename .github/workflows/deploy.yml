name: Build → Scan → Deploy

on:
  push:
    branches:
      - master

jobs:
  # ─── 1. Security Scan (Trivy) ────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  # ─── 2. Secret Leak Check (Gitleaks) ─────────────────────────────
  secret-scan:
    name: Secret Leak Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 3. Security Gate ────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [security-scan, secret-scan]
    steps:
      - name: All checks passed
        run: echo "✅ Security scan, secret check, and tests all passed. Proceeding to deploy."

  # ─── 4. Deploy ───────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [security-gate]
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "==> Navigating to project directory..."
            cd ${{ secrets.VPS_PROJECT_PATH }}

            echo "==> Fixing file ownership before pull..."
            sudo chown -R $(whoami):$(whoami) .

            echo "==> Pulling latest changes from master..."
            git fetch origin master
            git reset --hard origin/master

            echo "==> Restoring permissions for Laravel..."
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            echo "==> Restarting container (triggers entrypoint: composer install, migrate, cache)..."
            docker compose down
            docker compose up -d --build

            echo "==> Waiting for container to be healthy..."
            sleep 10

            echo "==> Verifying container is running..."
            docker compose ps

            echo "==> Deploy complete!"
