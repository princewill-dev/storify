services:
  app:
    build: .
    container_name: storify_app
    restart: always
    volumes:
      - ./:/var/www/html
    networks:
      - web_network
    env_file:
      - .env
    command: >
      sh -c "composer install --no-dev --optimize-autoloader &&
             php artisan vendor:publish --tag=log-viewer-assets --force &&
             php artisan config:clear && 
             php artisan cache:clear &&
             php artisan migrate --force && 
             /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf"

networks:
  web_network:
    external: true